name: Dependency lockfile recovery

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - ".github/workflows/lockfile-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-lockfile:
    if: ${{ hashFiles('package-lock.json') == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Commit the generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add npm lockfile for reproducible builds"
          git push
